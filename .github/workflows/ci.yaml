name: rules_swiftnav

on:
  pull_request: ~
  push:
    branches:
      - 'main'

jobs:
  example-small-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Run format
        run: |
          bazel run //tools/format:format.check 

      - name: Run tools tests
        run: |
          bazel test //tools/...

      - name: Build and generate coverage
        run: |
          cd examples/small_world
          ./scripts/generate_coverage.sh

      - name: Run format
        run: |
          cd examples/small_world
          bazel run //tools/buildifier:buildifier
          git diff --exit-code

  archive-tools-macos:
    # Guards the toolchains against Mach-O regressions in the binutils they
    # wrap. Both of these are macOS-only failure modes that the Linux job
    # above cannot catch:
    #
    #   strip: llvm-strip rejects several ELF-only options on macOS, so this
    #   exercises the same strip() target that bird-sweater relies on.
    #
    #   cc_static_library: the archiver is llvm-ar, which nests input archives
    #   as members if invoked as `llvm-ar rc out.a a.a b.a`. The result still
    #   builds, and only fails at link time with "archive member 'libfoo.a'
    #   not a mach-o file", so nothing else would notice.
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build and test strip and static library examples
        run: |
          cd examples/small_world
          bazel test //src/strip_tool/... //src/static_library/...
