name: rules_swiftnav

on:
  pull_request: ~
  push:
    branches:
      - 'main'

jobs:
  example-small-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Run format
        run: |
          bazel run //tools/format:format.check 

      - name: Run tools tests
        run: |
          bazel test //tools/...

      - name: Build and generate coverage
        run: |
          cd examples/small_world
          ./scripts/generate_coverage.sh

      - name: Run format
        run: |
          cd examples/small_world
          bazel run //tools/buildifier:buildifier
          git diff --exit-code

  strip-macos:
    # Guards the strip rule against Mach-O regressions: llvm-strip rejects
    # several ELF-only options on macOS, so this exercises the same strip()
    # target that bird-sweater relies on. The Linux job above cannot catch a
    # Mach-O-only flag regression.
    #
    # Also guards cc_static_library on macOS: with the hermetic llvm toolchain
    # the archiver is llvm-ar, which only merges input archives through an
    # MRI script. The Linux job already takes that path, so only this job can
    # catch a regression to the old platform-based branch.
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build and test strip and static library examples
        run: |
          cd examples/small_world
          bazel test //src/strip_tool/... //src/static_library/...
